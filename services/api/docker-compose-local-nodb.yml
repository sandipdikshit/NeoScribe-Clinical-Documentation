version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: neoscribe_backend 
    volumes:
      - .:/app
    ports:
      - "4000:8000"
    env_file:
      - .env
    command: >
      sh -c "cd /app/app && poetry run uvicorn main:app --reload --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: