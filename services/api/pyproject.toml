psycopg2-binary = "^2.9.10"
pydantic = "^2.9.2"
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
bcrypt = "^4.2.0"
azure-storage-blob = "^12.23.1"
fastapi-cors = "^0.0.6"
markdown = "^3.7"
pdfkit = "^1.0.0"
css-inline = "^0.14.3"
python-markdown-math = "^0.8"
pydub = "^0.25.1"
